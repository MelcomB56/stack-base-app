name: Build & Push stackbase-agent

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
  release:
    types: [published]

env:
  IMAGE: ghcr.io/melcomb56/stackbase-agent

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./agent
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build native binaries
        working-directory: ./agent
        run: |
          GOOS=linux  GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/stackbase-agent-linux-amd64   .
          GOOS=linux  GOARCH=arm64 go build -ldflags="-s -w" -o ../dist/stackbase-agent-linux-arm64   .
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/stackbase-agent-darwin-amd64  .
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o ../dist/stackbase-agent-darwin-arm64  .

      - name: Upload binaries to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

      - name: Upload binaries as artifacts (branch push)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: stackbase-agent-binaries
          path: dist/*
          retention-days: 30
